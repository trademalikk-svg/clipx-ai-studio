<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#061326"><title>SHIF-A Tool Lab</title>
<style>
:root{color-scheme:dark;font-family:Arial,sans-serif}*{box-sizing:border-box}body{margin:0;background:#061326;color:#eef7ff;font:16px Arial}main{max-width:850px;margin:25px auto;padding:18px}.card{background:#0d2440;border:1px solid #23618e;border-radius:15px;padding:18px;margin:12px 0}input,select,textarea{width:100%;padding:12px;margin:7px 0;background:#07172b;color:white;border:1px solid #3678a8;border-radius:8px}textarea{min-height:170px}button{padding:11px 15px;margin:5px;background:#0876c9;color:white;border:0;border-radius:8px;cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #62d5ff;outline-offset:2px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#07172b;padding:14px;border-radius:9px;min-height:60px}.muted{color:#a8bfd5;font-size:13px}a{color:#8bdcff}
</style></head>
<body><main><p><a href="ai-tools.html">← All SHIF-A Tools</a></p>
<section class="card"><h1>SHIF-A Tool Lab</h1><p class="muted">22 free browser utilities. Processing stays on this device; no API key or cloud upload is required.</p>
<label for="tool">Choose tool</label><select id="tool"></select><p id="help" class="muted"></p><div id="extra"></div>
<label for="input">Input</label><textarea id="input" placeholder="Paste text or data…"></textarea>
<button id="run" type="button">Run tool</button><button id="copy" type="button">Copy output</button><button id="save" type="button">Download TXT</button><button id="clear" type="button">Clear</button>
<p id="status" class="muted" role="status" aria-live="polite"></p><pre id="out">Output appears here.</pre></section></main>
<script>
(()=>{"use strict";
const ids=["word-count","case-converter","remove-duplicates","sort-lines","clean-whitespace","slug-maker","hashtag-format","caption-breaker","bio-limit","title-case","keyword-groups","csv-json","json-format","url-inspector","base64","html-escape","regex-check","reading-time","text-diff","number-lines","filename-clean","image-info"];
const names=["Word Counter","Case Converter","Duplicate Remover","Line Sorter","Whitespace Cleaner","Slug Maker","Hashtag Formatter","Caption Breaker","Bio Length Checker","Title Case","Keyword Grouper","CSV to JSON","JSON Formatter","URL Inspector","Base64 Tool","HTML Escaper","Regex Tester","Reading Time","Text Diff","Line Numbering","Filename Cleaner","Image Info"];
const $=id=>document.getElementById(id);
const MAX_IMAGE_BYTES=15*1024*1024;
let imageRequestId=0;
const tool=$("tool"), input=$("input"), out=$("out"), status=$("status");
ids.forEach((id,i)=>{const option=document.createElement("option");option.value=id;option.textContent=names[i];tool.append(option)});
const requested=new URLSearchParams(location.search).get("tool");
if(ids.includes(requested))tool.value=requested;
function setup(){imageRequestId++;const id=tool.value;$("help").textContent=names[ids.indexOf(id)]+" · Runs locally in this browser.";$("extra").replaceChildren();
if(id==="base64"){const label=document.createElement("label"),mode=document.createElement("select");mode.id="base64Mode";label.htmlFor=mode.id;label.textContent="Base64 action";[["encode","Encode text to Base64"],["decode","Decode Base64 to text"]].forEach(([value,title])=>{const option=document.createElement("option");option.value=value;option.textContent=title;mode.append(option)});$("extra").append(label,mode)}
if(["text-diff","regex-check","image-info"].includes(id)){const label=document.createElement("label"),field=document.createElement(id==="text-diff"?"textarea":"input");field.id=id==="text-diff"?"second":id==="regex-check"?"pattern":"file";label.htmlFor=field.id;label.textContent=id==="text-diff"?"Second text":id==="regex-check"?"Regular expression pattern":"Select image";if(id==="image-info"){field.type="file";field.accept="image/png,image/jpeg,image/webp"}$("extra").append(label,field)}}
function parseCSV(source){const rows=[];let row=[],field="",quoted=false,afterQuote=false;for(let i=0;i<source.length;i++){const c=source[i];if(quoted){if(c==='"'&&source[i+1]==='"'){field+='"';i++}else if(c==='"'){quoted=false;afterQuote=true}else field+=c}else if(afterQuote){if(c===","){row.push(field);field="";afterQuote=false}else if(c==="\n"){row.push(field);rows.push(row);row=[];field="";afterQuote=false}else if(c!=="\r")throw Error("Closing quote के बाद केवल comma या नई line मान्य है")}else if(c==='"'){if(field!=="")throw Error("CSV में quote केवल field की शुरुआत में हो सकता है");quoted=true}else if(c===","){row.push(field);field=""}else if(c==="\n"){row.push(field);rows.push(row);row=[];field=""}else if(c!=="\r")field+=c}if(quoted)throw Error("CSV में closing quote नहीं मिला");row.push(field);if(row.some(v=>v!=="")||rows.length===0)rows.push(row);return rows}
function run(){const s=input.value,id=tool.value;try{let result="";switch(id){
case"word-count":result="Words: "+(s.trim()?s.trim().split(/\s+/u).length:0)+"\nCharacters: "+s.length+"\nNo spaces: "+s.replace(/\s/g,"").length;break;
case"case-converter":result="UPPERCASE:\n"+s.toLocaleUpperCase()+"\n\nlowercase:\n"+s.toLocaleLowerCase();break;
case"remove-duplicates":result=[...new Set(s.split(/\r?\n/))].join("\n");break;
case"sort-lines":result=s.split(/\r?\n/).sort((a,b)=>a.localeCompare(b)).join("\n");break;
case"clean-whitespace":result=s.split(/\r?\n/).map(x=>x.trim()).filter(Boolean).join("\n");break;
case"slug-maker":result=s.toLowerCase().trim().replace(/[^\p{L}\p{N}]+/gu,"-").replace(/^-|-$/g,"");break;
case"hashtag-format":result=s.split(/[\s,;#]+/).filter(Boolean).map(x=>"#"+x.replace(/[^\p{L}\p{N}_]/gu,"")).filter(x=>x!=="#").join(" ");break;
case"caption-breaker":{const words=s.trim().split(/\s+/u).filter(Boolean),lines=[];let line="";for(const word of words){if(line&& (line+" "+word).length>80){lines.push(line);line=word}else line=(line+" "+word).trim()}if(line)lines.push(line);result=lines.join("\n\n");break}
case"bio-limit":result=s.length+"/150 characters\n"+s.slice(0,150);break;
case"title-case":result=s.toLocaleLowerCase().replace(/(^|\s)(\p{L})/gu,(m,a,b)=>a+b.toLocaleUpperCase());break;
case"keyword-groups":{const groups={};s.split(/[\n,;]+/).forEach(value=>{const item=value.trim(),key=item.split(/\s+/)[0]?.toLocaleLowerCase();if(key)(groups[key]??=[]).push(item)});result=Object.entries(groups).map(([key,values])=>key+"\n"+values.join("\n")).join("\n\n");break}
case"csv-json":{const rows=parseCSV(s);if(rows.length<2)throw Error("CSV header और कम-से-कम एक data row डालें");const headers=rows[0].map((v,i)=>v.trim()||"column_"+(i+1));if(new Set(headers).size!==headers.length)throw Error("CSV header names unique होने चाहिए");result=JSON.stringify(rows.slice(1).filter(r=>r.some(v=>v!=="")).map((r,index)=>{if(r.length>headers.length)throw Error("Row "+(index+2)+" में header से ज्यादा columns हैं");return Object.fromEntries(headers.map((h,i)=>[h,r[i]??""]))}),null,2);break}
case"json-format":result=JSON.stringify(JSON.parse(s),null,2);break;
case"url-inspector":{const u=new URL(s);result="Protocol: "+u.protocol+"\nHost: "+u.host+"\nPath: "+u.pathname+"\nQuery: "+u.search+"\nHash: "+u.hash;break}
case"base64":{const mode=$("base64Mode").value;if(mode==="encode"){const bytes=new TextEncoder().encode(s);let binary="";for(const byte of bytes)binary+=String.fromCharCode(byte);result=btoa(binary)}else{const value=s.replace(/\\s+/g,"");if(!/^[A-Za-z0-9+/]*={0,2}$/.test(value)||value.length%4===1||(value.includes("=")&&value.length%4!==0))throw Error("Invalid Base64 input");let binary;try{binary=atob(value.padEnd(Math.ceil(value.length/4)*4,"="))}catch{throw Error("Invalid Base64 input")}const bytes=Uint8Array.from(binary,ch=>ch.charCodeAt(0));try{result=new TextDecoder("utf-8",{fatal:true}).decode(bytes)}catch{throw Error("Invalid Base64 input: text is not valid UTF-8")}}break}
case"html-escape":result=s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");break;
case"regex-check":{const pattern=$("pattern").value;if(pattern.length>REGEX_MAX_PATTERN)throw Error("Pattern 200 characters से छोटा रखें");if(s.length>REGEX_MAX_INPUT)throw Error("Input 10,000 characters से छोटा रखें");const workerSource='self.onmessage=({data})=>{try{const re=new RegExp(data.pattern,"g"),matches=[];let match;while((match=re.exec(data.text))!==null){matches.push({value:match[0],index:match.index});if(matches.length>=500)break;if(match[0]==="")re.lastIndex++}self.postMessage({ok:true,matches})}catch(error){self.postMessage({ok:false,error:error.message})}}';const workerUrl=URL.createObjectURL(new Blob([workerSource],{type:"text/javascript"}));let worker;try{worker=new Worker(workerUrl)}catch(error){URL.revokeObjectURL(workerUrl);throw Error("Regex Worker इस browser में उपलब्ध नहीं है")}let finished=false;const finish=()=>{if(finished)return;finished=true;clearTimeout(timer);worker.terminate();URL.revokeObjectURL(workerUrl)};const timer=setTimeout(()=>{finish();out.textContent="Error: Regex execution timed out.";status.textContent="Pattern बहुत जटिल है; इसे सरल करें।"},REGEX_TIMEOUT_MS);worker.onmessage=event=>{finish();if(!event.data.ok){out.textContent="Error: "+event.data.error;status.textContent="Regex pattern जाँचें।";return}const matches=event.data.matches;out.textContent="Matches: "+matches.length+(matches.length>=REGEX_MAX_MATCHES?" (first 500 shown)":"")+"\\n"+matches.map(m=>m.value+" @ "+m.index).join("\\n");status.textContent="Done ✓"};worker.onerror=()=>{finish();out.textContent="Error: Regex worker failed.";status.textContent="Pattern जाँचें और फिर कोशिश करें।"};worker.postMessage({pattern,text:s});status.textContent="Regex जाँच रहे हैं…";return}
case"reading-time":{const words=s.trim()?s.trim().split(/\s+/u).length:0;result="Words: "+words+"\nMinutes: "+Math.ceil(words/200);break}
case"text-diff":{const first=new Set(s.split(/\r?\n/)),second=new Set($("second").value.split(/\r?\n/));result="Only first:\n"+[...first].filter(x=>!second.has(x)).join("\n")+"\n\nOnly second:\n"+[...second].filter(x=>!first.has(x)).join("\n");break}
case"number-lines":result=s.split(/\r?\n/).map((line,i)=>(i+1)+". "+line).join("\n");break;
case"filename-clean":result=s.replace(/[\\/:*?"<>|]/g,"-").replace(/\s+/g,"-").slice(0,180);break;
case"image-info":{const file=$("file").files[0];if(!file)throw Error("पहले image चुनें");if(!["image/png","image/jpeg","image/webp"].includes(file.type))throw Error("केवल PNG, JPEG या WebP चुनें");if(file.size>MAX_IMAGE_BYTES)throw Error("Image 15 MB से छोटी होनी चाहिए");const requestId=++imageRequestId,url=URL.createObjectURL(file),img=new Image();img.onload=()=>{URL.revokeObjectURL(url);if(requestId!==imageRequestId)return;out.textContent=file.name+"\n"+file.type+"\n"+file.size+" bytes\\n"+img.naturalWidth+" × "+img.naturalHeight+" px";status.textContent="Image details ready."};img.onerror=()=>{URL.revokeObjectURL(url);if(requestId!==imageRequestId)return;status.textContent="Image read नहीं हो सकी."};img.src=url;status.textContent="Image पढ़ रहे हैं…";return}
}out.textContent=result;status.textContent="Done ✓"}catch(error){out.textContent="Error: "+error.message;status.textContent="Input जाँचें और फिर कोशिश करें।"}}
async function copyOutput(){const value=out.textContent;if(!value||value==="Output appears here."){status.textContent="पहले tool चलाएँ।";return}try{await navigator.clipboard.writeText(value);status.textContent="Copied ✓"}catch{status.textContent="Clipboard permission नहीं मिली; output को select करके copy करें।"}}
function downloadOutput(){const value=out.textContent;if(!value||value==="Output appears here."){status.textContent="पहले tool चलाएँ।";return}const url=URL.createObjectURL(new Blob([value],{type:"text/plain;charset=utf-8"})),a=document.createElement("a");a.href=url;a.download="shif-a-output.txt";document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);status.textContent="Download शुरू हुआ ✓"}
tool.addEventListener("change",setup);$("run").addEventListener("click",run);$("copy").addEventListener("click",copyOutput);$("save").addEventListener("click",downloadOutput);$("clear").addEventListener("click",()=>{input.value="";out.textContent="Output appears here.";status.textContent="Cleared.";});setup();
})();
</script></body></html>
