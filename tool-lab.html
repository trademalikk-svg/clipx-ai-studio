<!doctype html><html lang="hi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SHIF-A Tool Lab</title><style>body{margin:0;background:#061326;color:#eef7ff;font:16px Arial}main{max-width:850px;margin:25px auto;padding:18px}.card{background:#0d2440;border:1px solid #23618e;border-radius:15px;padding:18px;margin:12px 0}input,select,textarea{box-sizing:border-box;width:100%;padding:12px;margin:7px 0;background:#07172b;color:white;border:1px solid #3678a8;border-radius:8px}textarea{min-height:170px}button{padding:11px 15px;margin:5px;background:#0876c9;color:white;border:0;border-radius:8px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#07172b;padding:14px;border-radius:9px;min-height:60px}.muted{color:#a8bfd5;font-size:13px}a{color:#8bdcff}</style><main><p><a href="ai-tools.html">← All SHIF-A Tools</a></p><section class="card"><h1>SHIF-A Tool Lab</h1><p class="muted">22 free browser utilities. Local processing only: no API keys, cloud upload or paid AI. Do not paste secrets into text utilities.</p><select id="tool"></select><p id="help" class="muted"></p><div id="extra"></div><textarea id="input" placeholder="Paste text or data…"></textarea><button id="run">Run</button><button id="copy">Copy</button><button id="save">Download TXT</button><button id="clear">Clear</button><p id="status" class="muted"></p><pre id="out">Output appears here.</pre></section></main><script>(()=>{const ids=["word-count","case-converter","remove-duplicates","sort-lines","clean-whitespace","slug-maker","hashtag-format","caption-breaker","bio-limit","title-case","keyword-groups","csv-json","json-format","url-inspector","base64","html-escape","regex-check","reading-time","text-diff","number-lines","filename-clean","image-info"],names=["Word Counter","Case Converter","Duplicate Remover","Line Sorter","Whitespace Cleaner","Slug Maker","Hashtag Formatter","Caption Breaker","Bio Length Checker","Title Case","Keyword Grouper","CSV to JSON","JSON Formatter","URL Inspector","Base64 Tool","HTML Escaper","Regex Tester","Reading Time","Text Diff","Line Numbering","Filename Cleaner","Image Info"],$=x=>document.getElementById(x);ids.forEach((id,i)=>{let o=document.createElement('option');o.value=id;o.textContent=names[i];$('tool').append(o)});function setup(){let id=$('tool').value;$('help').textContent=names[ids.indexOf(id)]+' · Runs locally in this browser.';$('extra').replaceChildren();if(id==='text-diff'||id==='regex-check'||id==='image-info'){let l=document.createElement('label'),e=document.createElement(id==='text-diff'?'textarea':'input');e.id=id==='text-diff'?'second':id==='regex-check'?'pattern':'file';if(id==='image-info'){e.type='file';e.accept='image/*';l.textContent='Select image'}else l.textContent=id==='text-diff'?'Second text':'Regex pattern';$('extra').append(l,e)}}function run(){let s=$('input').value,id=$('tool').value,o='';try{switch(id){case'word-count':o='Words: '+(s.trim()?s.trim().split(/\s+/).length:0)+'\nCharacters: '+s.length+'\nNo spaces: '+s.replace(/\s/g,'').length;break;case'case-converter':o=s.toUpperCase()+'\n\n'+s.toLowerCase();break;case'remove-duplicates':o=[...new Set(s.split(/\r?\n/))].join('\n');break;case'sort-lines':o=s.split(/\r?\n/).sort((a,b)=>a.localeCompare(b)).join('\n');break;case'clean-whitespace':o=s.split(/\r?\n/).map(x=>x.trim()).filter(Boolean).join('\n');break;case'slug-maker':o=s.toLowerCase().trim().replace(/[^\p{L}\p{N}]+/gu,'-').replace(/^-|-$/g,'');break;case'hashtag-format':o=s.split(/[\s,;#]+/).filter(Boolean).map(x=>'#'+x.replace(/[^\p{L}\p{N}_]/gu,'')).join(' ');break;case'caption-breaker':{let a=s.split(/\s+/),r=[],v='';a.forEach(w=>{if((v+' '+w).trim().length>80){r.push(v);v=w}else v=(v+' '+w).trim()});if(v)r.push(v);o=r.join('\n\n');break}case'bio-limit':o=s.length+'/150 characters\n'+s.slice(0,150);break;case'title-case':o=s.toLowerCase().replace(/(^|\s)([a-z])/g,(m,a,b)=>a+b.toUpperCase());break;case'keyword-groups':{let g={};s.split(/[\n,;]+/).forEach(x=>{let k=x.trim().split(/\s+/)[0]?.toLowerCase();if(k)(g[k]??=[]).push(x.trim())});o=Object.entries(g).map(([k,v])=>k+'\n'+v.join('\n')).join('\n\n');break}case'csv-json':{let a=s.split(/\r?\n/).map(x=>x.split(','));if(a.length<2)throw Error('Add CSV header and rows');o=JSON.stringify(a.slice(1).map(r=>Object.fromEntries(a[0].map((h,i)=>[h,r[i]||'']))),null,2);break}case'json-format':o=JSON.stringify(JSON.parse(s),null,2);break;case'url-inspector':{let u=new URL(s);o='Protocol: '+u.protocol+'\nHost: '+u.host+'\nPath: '+u.pathname+'\nQuery: '+u.search;break}case'base64':{try{o='Encoded: '+btoa(unescape(encodeURIComponent(s)))+'\nDecoded: '+decodeURIComponent(escape(atob(s.trim())))}catch(e){o='Could not decode input; encoded text: '+btoa(unescape(encodeURIComponent(s)))}break}case'html-escape':o=s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');break;case'regex-check':{let m=[...s.matchAll(new RegExp($('pattern').value,'g'))];o='Matches: '+m.length+'\n'+m.map(x=>x[0]+' @ '+x.index).join('\n');break}case'reading-time':o='Words: '+s.trim().split(/\s+/).filter(Boolean).length+'\nMinutes: '+Math.ceil(s.trim().split(/\s+/).filter(Boolean).length/200);break;case'text-diff':{let a=new Set(s.split(/\r?\n/)),b=new Set($('second').value.split(/\r?\n/));o='Only first:\n'+[...a].filter(x=>!b.has(x)).join('\n')+'\nOnly second:\n'+[...b].filter(x=>!a.has(x)).join('\n');break}case'number-lines':o=s.split(/\r?\n/).map((x,i)=>(i+1)+'. '+x).join('\n');break;case'filename-clean':o=s.replace(/[\\/:*?"<>|]/g,'-').replace(/\s+/g,'-').slice(0,180);break;case'image-info':{let f=$('file').files[0];if(!f)throw Error('Select an image');let im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{$('out').textContent=f.name+'\n'+f.type+'\n'+f.size+' bytes\n'+im.naturalWidth+' × '+im.naturalHeight+' px';URL.revokeObjectURL(u)};im.src=u;return}}$('out').textContent=o;$('status').textContent='Done'}catch(e){$('out').textContent='Error: '+e.message;$('status').textContent='Check input'}}$('tool').onchange=setup;$('run').onclick=run;$('copy').onclick=()=>navigator.clipboard?.writeText($('out').textContent);$('save').onclick=()=>{let a=document.createElement('a'),u=URL.createObjectURL(new Blob([$('out').textContent],{type:'text/plain'}));a.href=u;a.download='shif-a-output.txt';a.click();URL.revokeObjectURL(u)};$('clear').onclick=()=>{$('input').value='';$('out').textContent='';$('status').textContent='Cleared'};setup()})();</script>
