name: SHIF-A Daily SEO Research

on:
  schedule:
    # 06:00 India Standard Time (UTC+05:30)
    - cron: '30 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shif-a-daily-seo-research
  cancel-in-progress: false

jobs:
  daily-seo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run daily SEO research contract tests
        run: python -m unittest discover -s tests -p 'test_daily_seo*.py' -v

      - name: Collect free trend snapshots and draft research report
        run: python scripts/daily_seo.py

      - name: Generate daily organic content drafts
        run: python scripts/daily_growth.py

      - name: Upload dated organic content draft pack
        uses: actions/upload-artifact@v4
        with:
          name: shif-a-daily-growth-drafts-${{ github.run_id }}
          path: growth-reports/*.md
          if-no-files-found: error
          retention-days: 14

      - name: Upload dated research report
        uses: actions/upload-artifact@v4
        with:
          name: shif-a-daily-seo-report-\${{ github.run_id }}
          path: seo-reports/*.md
          if-no-files-found: error
          retention-days: 14
