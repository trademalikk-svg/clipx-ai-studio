name: Validate ClipX
on:
  push:
    branches: [main, shif-a-platform-foundation]
  workflow_dispatch:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run SHIF-A workspace and tools contract tests
        run: python3 -m unittest discover -s tests -p 'test_shif_a_*.py'
      - name: Check inline JavaScript syntax in all pages
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, re, subprocess, tempfile
          pages = sorted(pathlib.Path(".").glob("*.html"))
          checked = 0
          for page in pages:
              html = page.read_text(encoding="utf-8")
              scripts = re.findall(r"<script\b([^>]*)>(.*?)</script\s*>", html, re.I | re.S)
              for index, (attrs, source) in enumerate(scripts):
                  if not source.strip() or re.search(r"\bsrc\s*=", attrs, re.I) or re.search(r"application/ld\+json", attrs, re.I):
                      continue
                  is_module = bool(re.search(r"type\s*=\s*[\"']module[\"']", attrs, re.I))
                  suffix = ".mjs" if is_module else ".js"
                  path = pathlib.Path(tempfile.gettempdir()) / f"clipx-{page.stem}-{index}{suffix}"
                  path.write_text(source, encoding="utf-8")
                  subprocess.run(["node", "--check", str(path)], check=True)
                  checked += 1
          if checked == 0:
              raise SystemExit("No inline JavaScript blocks were checked.")
          print(f"Syntax OK: {checked} inline JavaScript blocks across {len(pages)} HTML pages.")
          html = pathlib.Path("index.html").read_text(encoding="utf-8")
          sections = [section for section in re.findall(r"<section\b[^>]*\bid=[\"']([^\"']+)[\"']", html, re.I) if section not in ("video-editor-guide", "platformTools")]
          groups = re.search(r"const groups = \{(.*?)\n \};", html, re.S)
          if not groups:
              raise SystemExit("Workspace route map was not found.")
          missing = [section for section in sections if f'"{section}"' not in groups.group(1)]
          if missing:
              raise SystemExit("Sections missing from workspace routes: " + ", ".join(missing))
          print(f"Workspace routes OK: {len(sections)} sections.")
          PY
      - name: Check SEO, sitemap, free-mode and upload safeguards
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, re, xml.etree.ElementTree as ET
          base = "https://trademalikk-svg.github.io/clipx-ai-studio/"
          sitemap = ET.parse("sitemap.xml").getroot()
          ns = {"sm": "http://www.sitemaps.org/schemas/sitemap/0.9"}
          urls = [node.text for node in sitemap.findall("sm:url/sm:loc", ns)]
          if not urls or len(urls) != len(set(urls)):
              raise SystemExit("Sitemap is empty or contains duplicate URLs.")
          expected = {base, base + "ai-tools.html", base + "coding-studio.html", *(base + name for name in ["creator-tools.html", "about.html", "contact.html", "privacy.html", "terms.html", "guides.html", "guide-youtube-shorts.html", "guide-hindi-subtitles.html", "guide-youtube-thumbnail.html", "guide-hindi-shorts.html", "split-video-into-multiple-clips.html"])}
          if set(urls) != expected:
              raise SystemExit("Sitemap URLs do not match the expected public pages.")
          for url in urls:
              path = "index.html" if url == base else url.removeprefix(base)
              file = pathlib.Path(path)
              if not file.is_file():
                  raise SystemExit(f"Sitemap target is missing: {path}")
              html = file.read_text(encoding="utf-8")
              canonical = re.search(r"""<link\b[^>]*rel=["']canonical["'][^>]*href=["']([^"']+)""", html, re.I)
              if path != "index.html" and (not canonical or canonical.group(1) != url):
                  raise SystemExit(f"Canonical URL missing or incorrect: {path}")
              if re.search(r"""<meta\b[^>]*name=["']robots["'][^>]*content=["'][^"']*noindex""", html, re.I):
                  raise SystemExit(f"Public page is marked noindex: {path}")
          robots = pathlib.Path("robots.txt").read_text(encoding="utf-8")
          if "Sitemap: " + base + "sitemap.xml" not in robots:
              raise SystemExit("robots.txt does not point to the public sitemap.")
          admin = pathlib.Path("admin.html").read_text(encoding="utf-8")
          if not re.search(r"""<meta\b[^>]*name=["']robots["'][^>]*content=["'][^"']*noindex""", admin, re.I):
              raise SystemExit("Support admin page must remain noindex.")
          if base + "admin.html" in urls:
              raise SystemExit("Private support admin page must not be listed in the public sitemap.")
          gitignore = pathlib.Path(".gitignore").read_text(encoding="utf-8")
          for pattern in [".env", ".env.*", "**/.env", "**/.env.*"]:
              if pattern not in gitignore.splitlines():
                  raise SystemExit(f".gitignore is missing secret-file rule: {pattern}")
          env_files = [p for p in pathlib.Path(".").rglob(".env*") if ".git" not in p.parts and p.name != ".env.example"]
          if env_files:
              raise SystemExit("Potential environment secret file found in repository: " + ", ".join(map(str, env_files)))
          home = pathlib.Path("index.html").read_text(encoding="utf-8")
          if not re.search(r"const\s+CLIPX_FREE_MODE\s*=\s*true", home):
              raise SystemExit("Free Browser Mode is not explicitly enabled.")
          for fn, guard in [("clipxStartCloudUpload", "Cloud rendering is disabled in Free Browser Mode."), ("clipxRunwayGenerate", "External AI video generation is disabled in Free Browser Mode.")]:
              match = re.search(rf"async\s+function\s+{fn}\s*\([^)]*\)\s*\{{", home)
              if not match or guard not in home[match.end():match.end()+500]:
                  raise SystemExit(f"Free-mode guard missing in {fn}.")
          health_test = re.search(r"async\s+function\s+testBackendConnection\s*\([^)]*\)\s*\{", home)
          if not health_test or 'body: { action: "health" }' not in home[health_test.end():health_test.end()+1800]:
              raise SystemExit("Safe health-only backend connection test is missing.")
          if 'body: { action: "create"' in home[health_test.end():health_test.end()+1800]:
              raise SystemExit("Backend health test must not request video generation.")
          if "selectedVideoFile.size > 3 * 1024 * 1024 * 1024" not in home:
              raise SystemExit("Local browser upload safeguard (3 GB) is missing.")
          if "file.size > 2 * 1024 * 1024 * 1024" not in home:
              raise SystemExit("Cloud upload safeguard (2 GB) is missing.")
          if not re.search(r"file\.size\s*>\s*150\s*\*\s*1024\s*\*\s*1024", home):
              raise SystemExit("Whisper auto-caption memory safeguard (150 MB) is missing.")
          print(f"SEO/sitemap OK: {len(urls)} pages; Free Browser Mode guards, local 3 GB / cloud 2 GB video limits and 150 MB caption safeguard OK.")
          PY
      - name: Check local page links and duplicate HTML IDs
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib
          from html.parser import HTMLParser
          from urllib.parse import urlsplit

          class PageParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = set()
                  self.links = []
                  self.duplicates = set()
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  ident = attrs.get("id")
                  if ident:
                      if ident in self.ids:
                          self.duplicates.add(ident)
                      self.ids.add(ident)
                  for attr in ("href", "src", "poster"):
                      value = attrs.get(attr)
                      if value:
                          self.links.append((tag, attr, value))

          pages = sorted(pathlib.Path(".").glob("*.html"))
          parsed = {}
          for page in pages:
              parser = PageParser()
              parser.feed(page.read_text(encoding="utf-8"))
              if parser.duplicates:
                  raise SystemExit(f"{page}: duplicate IDs: {', '.join(sorted(parser.duplicates))}")
              parsed[page] = parser

          errors = []
          for page, parser in parsed.items():
              for tag, attr, value in parser.links:
                  value = value.strip()
                  if not value or value.startswith(("#", "data:", "blob:", "javascript:", "mailto:", "tel:")):
                      continue
                  parts = urlsplit(value)
                  if parts.scheme or parts.netloc or not parts.path:
                      continue
                  target = (page.parent / parts.path).resolve()
                  if parts.path.endswith("/"):
                      target = target / "index.html"
                  if not target.is_file():
                      errors.append(f"{page}: {tag}[{attr}] -> {value}")
          if errors:
              raise SystemExit("Broken local links/resources:\\n" + "\\n".join(errors))
          print(f"Local links/resources OK across {len(pages)} HTML pages; duplicate IDs: none.")
          PY
      - name: Check SHIF-A browser script syntax
        run: |
          node --check scripts/shif-a-coding-studio.js
          node --check scripts/shif-a-browser-tools.js
          node --check scripts/shif-a-tools.js
          node --check scripts/shif-a-owner-security.js
      - name: Run JavaScript contract tests
        run: node --test tests/homepage-layout.test.mjs tests/image-studio-contract.test.js tests/voice-studio-contract.test.js tests/browser-caption-unicode.test.js
      - name: Check FFmpeg worker syntax
        run: node --check worker/worker.js
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Supabase Edge Functions
        run: |
          deno check supabase/functions/create-clip-job/index.ts
          deno check supabase/functions/complete-clip-upload/index.ts
          deno check supabase/functions/generate-video/index.ts
          deno check supabase/functions/shif-a-access/index.ts
          deno check supabase/functions/shif-a-security-audit/index.ts
          deno check supabase/functions/shif-a-owner-recovery/index.ts
