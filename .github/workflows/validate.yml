name: Validate ClipX
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check inline JavaScript syntax in all pages
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, re, subprocess, tempfile
          pages = sorted(pathlib.Path(".").glob("*.html"))
          checked = 0
          for page in pages:
              html = page.read_text(encoding="utf-8")
              scripts = re.findall(r"<script\b([^>]*)>(.*?)</script\s*>", html, re.I | re.S)
              for index, (attrs, source) in enumerate(scripts):
                  if not source.strip() or re.search(r"\bsrc\s*=", attrs, re.I) or re.search(r"application/ld\+json", attrs, re.I):
                      continue
                  is_module = bool(re.search(r"type\s*=\s*[\"']module[\"']", attrs, re.I))
                  suffix = ".mjs" if is_module else ".js"
                  path = pathlib.Path(tempfile.gettempdir()) / f"clipx-{page.stem}-{index}{suffix}"
                  path.write_text(source, encoding="utf-8")
                  subprocess.run(["node", "--check", str(path)], check=True)
                  checked += 1
          if checked == 0:
              raise SystemExit("No inline JavaScript blocks were checked.")
          print(f"Syntax OK: {checked} inline JavaScript blocks across {len(pages)} HTML pages.")
          html = pathlib.Path("index.html").read_text(encoding="utf-8")
          sections = re.findall(r"<section\b[^>]*\bid=[\"']([^\"']+)[\"']", html, re.I)
          groups = re.search(r"const groups = \{(.*?)\n \};", html, re.S)
          if not groups:
              raise SystemExit("Workspace route map was not found.")
          missing = [section for section in sections if f'"{section}"' not in groups.group(1)]
          if missing:
              raise SystemExit("Sections missing from workspace routes: " + ", ".join(missing))
          print(f"Workspace routes OK: {len(sections)} sections.")
          PY
      - name: Check SEO, sitemap, free-mode and upload safeguards
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, re, xml.etree.ElementTree as ET
          base = "https://trademalikk-svg.github.io/clipx-ai-studio/"
          sitemap = ET.parse("sitemap.xml").getroot()
          ns = {"sm": "http://www.sitemaps.org/schemas/sitemap/0.9"}
          urls = [node.text for node in sitemap.findall("sm:url/sm:loc", ns)]
          if not urls or len(urls) != len(set(urls)):
              raise SystemExit("Sitemap is empty or contains duplicate URLs.")
          expected = {base, *(base + name for name in ["creator-tools.html", "about.html", "contact.html", "privacy.html", "terms.html"])}
          if set(urls) != expected:
              raise SystemExit("Sitemap URLs do not match the expected public pages.")
          for url in urls:
              path = "index.html" if url == base else url.removeprefix(base)
              file = pathlib.Path(path)
              if not file.is_file():
                  raise SystemExit(f"Sitemap target is missing: {path}")
              html = file.read_text(encoding="utf-8")
              canonical = re.search(r"""<link\b[^>]*rel=["']canonical["'][^>]*href=["']([^"']+)""", html, re.I)
              if path != "index.html" and (not canonical or canonical.group(1) != url):
                  raise SystemExit(f"Canonical URL missing or incorrect: {path}")
              if re.search(r"""<meta\b[^>]*name=["']robots["'][^>]*content=["'][^"']*noindex""", html, re.I):
                  raise SystemExit(f"Public page is marked noindex: {path}")
          robots = pathlib.Path("robots.txt").read_text(encoding="utf-8")
          if "Sitemap: " + base + "sitemap.xml" not in robots:
              raise SystemExit("robots.txt does not point to the public sitemap.")
          home = pathlib.Path("index.html").read_text(encoding="utf-8")
          if not re.search(r"const\s+CLIPX_FREE_MODE\s*=\s*true", home):
              raise SystemExit("Free Browser Mode is not explicitly enabled.")
          for fn, guard in [("testBackendConnection", "Backend features are disabled in Free Browser Mode."), ("clipxStartCloudUpload", "Cloud rendering is disabled in Free Browser Mode."), ("clipxRunwayGenerate", "External AI video generation is disabled in Free Browser Mode.")]:
              match = re.search(rf"async\s+function\s+{fn}\s*\([^)]*\)\s*\{{", home)
              if not match or guard not in home[match.end():match.end()+500]:
                  raise SystemExit(f"Free-mode guard missing in {fn}.")
          if not re.search(r"file\.size\s*>\s*150\s*\*\s*1024\s*\*\s*1024", home):
              raise SystemExit("Browser upload size safeguard (150 MB) is missing.")
          print(f"SEO/sitemap OK: {len(urls)} pages; Free Browser Mode guards and 150 MB upload safeguard OK.")
          PY
      - name: Check FFmpeg worker syntax
        run: node --check worker/worker.js
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Supabase Edge Functions
        run: |
          deno check supabase/functions/create-clip-job/index.ts
          deno check supabase/functions/complete-clip-upload/index.ts
          deno check supabase/functions/generate-video/index.ts
